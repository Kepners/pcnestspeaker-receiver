<!DOCTYPE html>
<html>
<head>
  <title>PC Nest Speaker - Audio Receiver</title>
  <!-- 1.5.8: defeat Chromium's 10-min HTTP cache on Cast Audio. GitHub Pages
       forces Cache-Control: max-age=600 which is overrideable per-document
       via <meta http-equiv>. Without these, force_relaunch gets a fresh
       receiver process but Chromium's disk cache still serves the stale
       receiver-audio.html. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #334E58; overflow: hidden; }
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FCBFB7;
      font-family: 'Segoe UI', sans-serif;
      font-size: 24px;
      text-align: center;
    }
    #player { display: none; }
  </style>
</head>
<body>
  <cast-media-player id="player"></cast-media-player>
  <div id="status">Waiting for connection...</div>

  <!-- Audio elements (invisible) -->
  <audio id="webrtc-audio" autoplay></audio>
  <audio id="hls-audio" autoplay></audio>

  <script>
    const WEBRTC_NAMESPACE = 'urn:x-cast:com.pcnestspeaker.webrtc';

    // ===================
    // Cast Framework Setup
    // ===================
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const playbackConfig = new cast.framework.PlaybackConfig();

    // Low latency settings
    playbackConfig.autoResumeDuration = 0;
    playbackConfig.autoPauseDuration = 0;
    playbackConfig.initialBandwidth = 100000000;
    playbackConfig.disablePreload = true;

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.PRELOAD,
      () => null
    );

    playerManager.setPlaybackConfig(playbackConfig);

    // ===================
    // WebRTC via MediaMTX WHEP
    // ===================
    let peerConnection = null;
    let whepResourceUrl = null;
    const webrtcAudio = document.getElementById('webrtc-audio');
    const hlsAudio = document.getElementById('hls-audio');
    let hlsPlayer = null;
    let currentMode = null; // 'webrtc' or 'hls'

    function log(msg) {
      console.log('[Audio] ' + msg);
      document.getElementById('status').textContent = msg;
    }

    // Retry configuration
    let retryCount = 0;
    const MAX_RETRIES = 5;
    const RETRY_DELAY = 2000;

    // ===================
    // RTT Measurement
    // ===================
    let rttMeasurementInterval = null;
    let rttSamples = [];
    const RTT_SAMPLE_COUNT = 5;
    const RTT_POLL_INTERVAL = 2000; // 2 seconds
    const BUFFER_OFFSET_MS = 160; // Pipeline: FFmpeg 50ms + Opus 20ms + Jitter 50ms + Decode 10ms + Speaker 30ms

    async function measureRTT() {
      if (!peerConnection || peerConnection.connectionState !== 'connected') {
        return null;
      }

      try {
        const stats = await peerConnection.getStats();
        for (const report of stats.values()) {
          // Look for the active ICE candidate pair
          if (report.type === 'candidate-pair' && report.state === 'succeeded') {
            if (report.currentRoundTripTime !== undefined) {
              return Math.round(report.currentRoundTripTime * 1000); // Convert to ms
            }
          }
        }
      } catch (e) {
        console.error('[RTT] getStats error:', e);
      }
      return null;
    }

    function startRTTMeasurement() {
      if (rttMeasurementInterval) return; // Already measuring

      rttSamples = [];
      console.log('[RTT] Starting measurement...');
      log('Measuring latency...');

      rttMeasurementInterval = setInterval(async () => {
        const rtt = await measureRTT();
        if (rtt !== null) {
          rttSamples.push(rtt);
          console.log('[RTT] Sample:', rtt, 'ms');

          if (rttSamples.length >= RTT_SAMPLE_COUNT) {
            // Calculate average RTT
            const avgRTT = Math.round(rttSamples.reduce((a, b) => a + b, 0) / rttSamples.length);
            // One-way latency is RTT/2, plus buffer offset
            const recommendedDelay = Math.round(avgRTT / 2) + BUFFER_OFFSET_MS;

            console.log('[RTT] Average RTT:', avgRTT, 'ms, Recommended delay:', recommendedDelay, 'ms');

            // Send result back to sender
            sendLatencyResult({
              rtt: avgRTT,
              recommendedDelay: recommendedDelay,
              samples: rttSamples.length
            });

            stopRTTMeasurement();
            log('Streaming audio...');
          }
        }
      }, RTT_POLL_INTERVAL);
    }

    function stopRTTMeasurement() {
      if (rttMeasurementInterval) {
        clearInterval(rttMeasurementInterval);
        rttMeasurementInterval = null;
      }
    }

    function sendLatencyResult(data) {
      try {
        // Send via Cast message to all connected senders
        context.sendCustomMessage(WEBRTC_NAMESPACE, undefined, {
          type: 'latency-result',
          ...data
        });
        console.log('[RTT] Sent latency result:', data);
      } catch (e) {
        console.error('[RTT] Failed to send result:', e);
      }
    }

    async function createWebRTCPeer(streamName = 'pcaudio', reconnectHandler = null) {
      log('Connecting WebRTC...');
      currentMode = 'webrtc';

      // Stop any HLS playback
      if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
      }
      hlsAudio.pause();
      hlsAudio.src = '';
      whepResourceUrl = null;
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      const iceConfig = { iceServers: [], iceTransportPolicy: 'all' };
      peerConnection = new RTCPeerConnection(iceConfig);

      peerConnection.ontrack = (event) => {
        console.log('[WebRTC] Track received:', event.track.kind);
        if (event.track.kind === 'audio') {
          if (event.streams && event.streams[0]) {
            webrtcAudio.srcObject = event.streams[0];
          } else {
            webrtcAudio.srcObject = new MediaStream([event.track]);
          }
          webrtcAudio.muted = false;
          webrtcAudio.volume = 1.0;
          webrtcAudio.play().then(() => {
            log('Streaming audio...');
          }).catch(e => {
            webrtcAudio.muted = true;
            webrtcAudio.play().then(() => {
              setTimeout(() => { webrtcAudio.muted = false; }, 100);
              log('Streaming audio...');
            });
          });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        console.log('[WebRTC] Connection state:', state);
        if (state === 'connected') log('Streaming audio...');
        else if (state === 'failed') {
          if (reconnectHandler) {
            log('Reconnecting...');
            setTimeout(reconnectHandler, 3000);
          } else {
            log('Connection failed');
          }
        }
      };

      peerConnection.oniceconnectionstatechange = () => {
        console.log('[WebRTC] ICE state:', peerConnection.iceConnectionState);
      };

      peerConnection.addTransceiver('audio', { direction: 'recvonly' });

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      // Wait for ICE gathering
      await new Promise((resolve) => {
        if (peerConnection.iceGatheringState === 'complete') resolve();
        else {
          const check = () => {
            if (peerConnection.iceGatheringState === 'complete') {
              peerConnection.removeEventListener('icegatheringstatechange', check);
              resolve();
            }
          };
          peerConnection.addEventListener('icegatheringstatechange', check);
          setTimeout(resolve, 2000);
        }
      });

      return peerConnection.localDescription.sdp;
    }

    async function connectWebRTC(serverUrl, streamName = 'pcaudio') {
      try {
        const offerSdp = await createWebRTCPeer(streamName, () => {
          disconnect();
          connectWebRTC(serverUrl, streamName);
        });

        const whepUrl = serverUrl + '/' + streamName + '/whep';
        console.log('[WebRTC] WHEP URL:', whepUrl);

        const response = await fetch(whepUrl, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/sdp' },
          body: offerSdp
        });

        if (!response.ok) throw new Error('WHEP error ' + response.status);

        const location = response.headers.get('Location');
        if (location) {
          whepResourceUrl = location.startsWith('/') ? serverUrl + location : location;
        }

        const answerSdp = await response.text();
        await peerConnection.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        retryCount = 0;
        console.log('[WebRTC] Connected successfully');

      } catch (e) {
        console.error('[WebRTC] Error:', e);
        retryCount++;
        if (retryCount <= MAX_RETRIES) {
          log(`Retry ${retryCount}/${MAX_RETRIES}...`);
          if (peerConnection) { peerConnection.close(); peerConnection = null; }
          setTimeout(() => connectWebRTC(serverUrl, streamName), RETRY_DELAY);
        } else {
          log('Connection failed');
          retryCount = 0;
        }
      }
    }

    async function requestProxyOffer(streamName = 'pcaudio') {
      try {
        const offerSdp = await createWebRTCPeer(streamName);
        context.sendCustomMessage(WEBRTC_NAMESPACE, undefined, {
          type: 'offer',
          stream: streamName,
          sdp: offerSdp
        });
        console.log('[WebRTC] Sent proxied SDP offer');
      } catch (e) {
        console.error('[WebRTC] Proxy offer error:', e);
        context.sendCustomMessage(WEBRTC_NAMESPACE, undefined, {
          type: 'offer-error',
          stream: streamName,
          error: e.message
        });
        log('Connection failed');
      }
    }

    async function applyProxyAnswer(sdp) {
      if (!peerConnection) {
        console.warn('[WebRTC] No pending peer connection for proxy answer');
        return;
      }

      try {
        await peerConnection.setRemoteDescription({ type: 'answer', sdp });
        retryCount = 0;
        console.log('[WebRTC] Proxy SDP answer applied');
        log('Streaming audio...');
      } catch (e) {
        console.error('[WebRTC] Proxy answer error:', e);
        log('Connection failed');
      }
    }

    function connectHLS(hlsUrl) {
      log('Connecting HLS...');
      currentMode = 'hls';

      // Stop any WebRTC
      disconnect();

      if (Hls.isSupported()) {
        hlsPlayer = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          liveSyncDurationCount: 1,
          liveMaxLatencyDurationCount: 3,
          liveDurationInfinity: true,
          highBufferWatchdogPeriod: 1
        });

        hlsPlayer.loadSource(hlsUrl);
        hlsPlayer.attachMedia(hlsAudio);

        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
          console.log('[HLS] Manifest parsed, playing...');
          hlsAudio.play().then(() => {
            log('Streaming audio...');
          }).catch(e => console.error('[HLS] Play error:', e));
        });

        hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
          console.error('[HLS] Error:', data.type, data.details);
          if (data.fatal) {
            log('HLS error - retrying...');
            hlsPlayer.destroy();
            setTimeout(() => connectHLS(hlsUrl), 3000);
          }
        });
      } else if (hlsAudio.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS support (Safari)
        hlsAudio.src = hlsUrl;
        hlsAudio.play().then(() => log('Streaming audio...')).catch(e => log('Play error'));
      } else {
        log('HLS not supported');
      }
    }

    function disconnect() {
      stopRTTMeasurement(); // Stop any ongoing measurement
      if (peerConnection) {
        if (whepResourceUrl) {
          fetch(whepResourceUrl, { method: 'DELETE' }).catch(() => {});
          whepResourceUrl = null;
        }
        peerConnection.close();
        peerConnection = null;
        webrtcAudio.srcObject = null;
      }
      if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
      }
      hlsAudio.pause();
      hlsAudio.src = '';
      currentMode = null;
    }

    // ===================
    // LOW-LATENCY MODE: WebSocket + raw PCM scheduled on AudioContext
    // Bypasses MediaSource entirely (MSE has a 3-5s implicit start buffer).
    // PC pipes raw 16-bit s16le PCM at 48 kHz stereo over WebSocket in fixed
    // 20 ms frames (3840 bytes). Receiver schedules each frame on the
    // AudioContext clock for sample-accurate playback.
    // Latency target: ~80-200 ms. Bandwidth ~1.5 Mbps (LAN-only, fine).
    // ===================
    let wsConnection = null;
    let wsAudioCtx = null;
    let wsNextStartTime = 0;
    let wsChunksScheduled = 0;
    const WS_PCM_SAMPLE_RATE = 48000;
    const WS_PCM_CHANNELS = 2;
    const WS_TARGET_HEAD = 0.06;     // start ~60 ms ahead of currentTime
    const WS_RESYNC_THRESHOLD = 0.5; // jump back to live edge if scheduled queue exceeds this

    function connectWebSocket(wsUrl) {
      log('Connecting WebSocket (raw PCM, low-latency)...');
      currentMode = 'ws';

      // Tear down any prior playback
      disconnect();

      try {
        wsAudioCtx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: WS_PCM_SAMPLE_RATE,
          latencyHint: 'interactive'
        });
      } catch (e) {
        console.error('[WS] AudioContext create failed:', e);
        log('AudioContext unavailable');
        return;
      }

      // Mute the <audio> element we used for HLS/WebRTC so it doesn't compete
      try { webrtcAudio.pause(); webrtcAudio.removeAttribute('src'); webrtcAudio.load(); } catch (e) {}
      try { hlsAudio.pause(); hlsAudio.removeAttribute('src'); hlsAudio.load(); } catch (e) {}

      wsNextStartTime = wsAudioCtx.currentTime + WS_TARGET_HEAD;
      wsChunksScheduled = 0;

      try {
        wsConnection = new WebSocket(wsUrl);
        wsConnection.binaryType = 'arraybuffer';
      } catch (e) {
        console.error('[WS] WebSocket create failed:', e);
        log('WebSocket unavailable');
        return;
      }

      wsConnection.onopen = () => {
        console.log('[WS] Connected to', wsUrl, 'sampleRate=', WS_PCM_SAMPLE_RATE, 'channels=', WS_PCM_CHANNELS);
        log('Streaming audio (low-latency)...');
        // AudioContext can be in 'suspended' state on receiver until user gesture;
        // Cast SDK launches usually grant audio autoplay.
        if (wsAudioCtx.state === 'suspended') {
          wsAudioCtx.resume().catch(e => console.warn('[WS] resume() failed:', e && e.message));
        }
      };

      wsConnection.onmessage = (event) => {
        if (!wsAudioCtx || wsAudioCtx.state === 'closed') return;
        const buf = event.data;
        if (!(buf instanceof ArrayBuffer)) return;
        if (buf.byteLength < 4) return;

        // 16-bit signed little-endian PCM, interleaved stereo
        const pcm16 = new Int16Array(buf);
        const samplesPerChannel = pcm16.length / WS_PCM_CHANNELS;
        if (samplesPerChannel < 1) return;

        const audioBuffer = wsAudioCtx.createBuffer(WS_PCM_CHANNELS, samplesPerChannel, WS_PCM_SAMPLE_RATE);
        for (let ch = 0; ch < WS_PCM_CHANNELS; ch++) {
          const channelData = audioBuffer.getChannelData(ch);
          for (let i = 0; i < samplesPerChannel; i++) {
            channelData[i] = pcm16[i * WS_PCM_CHANNELS + ch] / 32768;
          }
        }

        const now = wsAudioCtx.currentTime;

        // If the schedule head has run away from current time (we accumulated too
        // much), snap back to live edge. Avoids creeping latency from CPU stalls.
        if (wsNextStartTime - now > WS_RESYNC_THRESHOLD) {
          console.warn('[WS] Schedule head', (wsNextStartTime - now).toFixed(3),
                       's ahead — resyncing to live edge');
          wsNextStartTime = now + WS_TARGET_HEAD;
        }

        // If we underran (chunks arrived too slowly), reset to live edge with a
        // small look-ahead so the next chunk doesn't glitch.
        if (wsNextStartTime < now) {
          if (wsChunksScheduled > 0) {
            console.warn('[WS] Buffer underrun, drift=', (now - wsNextStartTime).toFixed(3));
          }
          wsNextStartTime = now + WS_TARGET_HEAD;
        }

        const source = wsAudioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(wsAudioCtx.destination);
        source.start(wsNextStartTime);
        wsNextStartTime += audioBuffer.duration;
        wsChunksScheduled++;
      };

      wsConnection.onerror = (err) => {
        console.error('[WS] error:', err);
        log('WebSocket error');
      };

      wsConnection.onclose = () => {
        console.log('[WS] Connection closed');
        if (currentMode === 'ws') log('Disconnected');
      };
    }

    function disconnectWebSocket() {
      if (wsConnection) {
        try { wsConnection.close(); } catch (e) {}
        wsConnection = null;
      }
      if (wsAudioCtx) {
        try { wsAudioCtx.close(); } catch (e) {}
        wsAudioCtx = null;
      }
      wsNextStartTime = 0;
      wsChunksScheduled = 0;
    }

    // ===================
    // LOW-LATENCY MODE: WebM/Opus over HTTP chunked + MediaSource Extensions.
    //
    // Cast for Audio runtime per Google docs:
    //   - MediaSource Extensions: SUPPORTED
    //   - HTMLAudioElement: SUPPORTED
    //   - Fetch: SUPPORTED
    //   - AudioContext: NOT supported (web API set is reduced for displayless devices)
    //   - Codecs incl. Opus in WebM
    //
    // Bug fix from earlier attempt: call audio.play() ONLY AFTER the first
    // appendBuffer has parsed (updateend fires). Calling play() before any
    // data made <audio> default to playing from buffered start, accumulating
    // ~6 s of latency. We now seek to live edge then play().
    // ===================
    let pcmAbort = null;
    let pcmMediaSource = null;
    let pcmSourceBuffer = null;
    let pcmObjectUrl = null;
    let pcmAppendQueue = [];
    let pcmStarted = false;
    let pcmDriftTimer = null;
    let pcmHealthTimer = null;
    const PCM_TARGET_LATENCY = 0.30;
    const PCM_MAX_DRIFT = 0.80;
    const PCM_CATCHUP_RATE = 1.10;
    const PCM_NORMAL_RATE = 1.0;

    function disconnectHttpPcm() {
      if (pcmDriftTimer) { try { clearInterval(pcmDriftTimer); } catch (e) {} pcmDriftTimer = null; }
      if (pcmHealthTimer) { try { clearInterval(pcmHealthTimer); } catch (e) {} pcmHealthTimer = null; }
      if (pcmAbort) { try { pcmAbort.abort(); } catch (e) {} pcmAbort = null; }
      if (pcmSourceBuffer && pcmMediaSource && pcmMediaSource.readyState === 'open') {
        try { pcmMediaSource.endOfStream(); } catch (e) {}
      }
      if (pcmObjectUrl) { try { URL.revokeObjectURL(pcmObjectUrl); } catch (e) {} pcmObjectUrl = null; }
      pcmSourceBuffer = null;
      pcmMediaSource = null;
      pcmAppendQueue = [];
      pcmStarted = false;
      try {
        webrtcAudio.pause();
        webrtcAudio.removeAttribute('src');
        webrtcAudio.load();
        webrtcAudio.playbackRate = 1.0;
        if ('preservesPitch' in webrtcAudio) webrtcAudio.preservesPitch = true;
        if ('mozPreservesPitch' in webrtcAudio) webrtcAudio.mozPreservesPitch = true;
        if ('webkitPreservesPitch' in webrtcAudio) webrtcAudio.webkitPreservesPitch = true;
      } catch (e) {}
    }

    function flushPcmQueue() {
      if (!pcmSourceBuffer || pcmSourceBuffer.updating || pcmAppendQueue.length === 0) return;
      try {
        pcmSourceBuffer.appendBuffer(pcmAppendQueue.shift());
      } catch (e) {
        console.warn('[PCM] appendBuffer threw:', e && e.message);
      }
    }

    function reportPcmStatus(status, detail) {
      try {
        const payload = { type: 'pcm-status', status };
        if (detail !== undefined) payload.detail = String(detail).substring(0, 300);
        context.sendCustomMessage(WEBRTC_NAMESPACE, undefined, payload);
        console.log('[PCM][status]', status, detail || '');
      } catch (e) {
        console.warn('[PCM] sendCustomMessage failed:', e && e.message);
      }
    }

    function describeAudioElement(audioEl) {
      let detail = 'ct=' + (audioEl.currentTime || 0).toFixed(2) +
        ' ready=' + audioEl.readyState +
        ' net=' + audioEl.networkState +
        ' paused=' + audioEl.paused +
        ' ended=' + audioEl.ended +
        ' bufLen=' + audioEl.buffered.length +
        ' seekLen=' + audioEl.seekable.length;
      try {
        if (audioEl.buffered.length > 0) {
          detail += ' bufStart=' + audioEl.buffered.start(0).toFixed(2) +
            ' bufEnd=' + audioEl.buffered.end(audioEl.buffered.length - 1).toFixed(2);
        }
      } catch (e) {
        detail += ' bufErr=' + (e && e.message);
      }
      try {
        if (audioEl.seekable.length > 0) {
          detail += ' seekStart=' + audioEl.seekable.start(0).toFixed(2) +
            ' seekEnd=' + audioEl.seekable.end(audioEl.seekable.length - 1).toFixed(2);
        }
      } catch (e) {
        detail += ' seekErr=' + (e && e.message);
      }
      return detail;
    }

    // 1.5.6: MSE+SourceBuffer path — control the buffer ourselves so we can
    // trim old data with sb.remove() and seek closer to live edge than the
    // native <audio> element's opaque jitter buffer allows.
    //
    // Throws on any failure path so the caller can fall back to plain <audio>.
    // Watchdog: if no bytes arrive within FIRST_BYTE_TIMEOUT_MS we abort and
    // throw so the caller can fall back. This matches the historical
    // observation that fetch().body.getReader() sometimes never resolves
    // headers on Cast Audio Chromium.
    async function connectHttpPcmMse(httpUrl) {
      reportPcmStatus('mse-attempt', httpUrl);
      const FIRST_BYTE_TIMEOUT_MS = 3500;
      const SOURCE_OPEN_TIMEOUT_MS = 4000;
      const TARGET_LATENCY = 0.20;   // seek to within 200 ms of live edge
      const SOFT_LAG = 0.40;
      const HARD_LAG = 0.80;
      const TRIM_KEEP_BEHIND = 0.50; // keep 0.5 s of history buffered

      const audioEl = webrtcAudio;
      try { hlsAudio.pause(); hlsAudio.removeAttribute('src'); hlsAudio.load(); } catch (e) {}

      audioEl.preload = 'auto';
      audioEl.crossOrigin = 'anonymous';
      audioEl.playbackRate = 1.0;
      if ('preservesPitch' in audioEl) audioEl.preservesPitch = true;
      if ('mozPreservesPitch' in audioEl) audioEl.mozPreservesPitch = true;
      if ('webkitPreservesPitch' in audioEl) audioEl.webkitPreservesPitch = true;

      // Wire native media events into the same status stream we use for the
      // <audio> path so the desktop log can compare apples to apples.
      const events = ['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','playing','waiting','stalled','suspend','ended','error','emptied'];
      events.forEach(ev => {
        audioEl.addEventListener(ev, function () {
          let detail;
          if (ev === 'error') {
            const me = audioEl.error;
            detail = me ? `code=${me.code} msg=${me.message}` : 'unknown';
          } else {
            detail = 'ct=' + (audioEl.currentTime || 0).toFixed(2) + ' rs=' + audioEl.readyState +
                     ' bufLen=' + audioEl.buffered.length;
            if (audioEl.buffered.length > 0) {
              detail += ' bufEnd=' + audioEl.buffered.end(audioEl.buffered.length - 1).toFixed(2);
            }
          }
          reportPcmStatus('mse-' + ev, detail);
          if (ev === 'playing') reportPcmStatus('playing', detail);
        });
      });

      const ms = new MediaSource();
      pcmMediaSource = ms;
      pcmObjectUrl = URL.createObjectURL(ms);
      audioEl.src = pcmObjectUrl;
      reportPcmStatus('mse-src-set', 'objectUrl');

      // Wait for sourceopen with a timeout
      await new Promise((resolve, reject) => {
        let done = false;
        const onOpen = () => {
          if (done) return;
          done = true;
          ms.removeEventListener('sourceopen', onOpen);
          resolve();
        };
        ms.addEventListener('sourceopen', onOpen);
        setTimeout(() => {
          if (!done) { done = true; reject(new Error('sourceopen timeout ' + SOURCE_OPEN_TIMEOUT_MS + 'ms')); }
        }, SOURCE_OPEN_TIMEOUT_MS);
      });

      reportPcmStatus('mse-sourceopen', 'readyState=' + ms.readyState);

      const sb = ms.addSourceBuffer('audio/webm; codecs="opus"');
      sb.mode = 'sequence';
      pcmSourceBuffer = sb;
      pcmAppendQueue = [];
      reportPcmStatus('mse-sb-added', 'mode=' + sb.mode);

      sb.addEventListener('updateend', () => {
        // Drain queue
        if (pcmAppendQueue.length > 0 && !sb.updating) {
          try { sb.appendBuffer(pcmAppendQueue.shift()); }
          catch (e) { reportPcmStatus('mse-append-err', e && e.message); }
        }
      });

      // 1.5.7 fix: race fetch() itself against a hard timeout. On Cast Audio
      // Chromium, `await fetch()` can hang indefinitely without resolving
      // headers even though the underlying socket is delivering bytes
      // (CLAUDE.md historical note). Without this race the function awaits
      // forever and the caller's catch never runs → user gets no audio.
      pcmAbort = new AbortController();
      reportPcmStatus('mse-fetch-start', '');

      const fetchPromise = fetch(httpUrl, {
        signal: pcmAbort.signal,
        cache: 'no-store',
        credentials: 'omit'
      });

      const FETCH_TIMEOUT_MS = 2500;
      const fetchWatchdog = new Promise((_, rej) => setTimeout(() => {
        try { pcmAbort.abort(); } catch (_) {}
        rej(new Error('fetch watchdog ' + FETCH_TIMEOUT_MS + 'ms'));
      }, FETCH_TIMEOUT_MS));

      let resp;
      try {
        resp = await Promise.race([fetchPromise, fetchWatchdog]);
      } catch (e) {
        throw new Error('fetch threw: ' + (e && e.message));
      }
      if (!resp.ok || !resp.body) throw new Error('fetch resp not ok ' + resp.status);
      reportPcmStatus('mse-fetch-headers', 'status=' + resp.status);

      const reader = resp.body.getReader();
      let bytesReceived = 0;
      let firstByteAt = 0;
      let firstByteResolve, firstByteReject;
      const firstByteSignal = new Promise((res, rej) => { firstByteResolve = res; firstByteReject = rej; });
      const firstByteTimer = setTimeout(() => {
        if (!firstByteAt) {
          try { pcmAbort.abort(); } catch (_) {}
          firstByteReject(new Error('first-byte watchdog ' + FIRST_BYTE_TIMEOUT_MS + 'ms'));
        }
      }, FIRST_BYTE_TIMEOUT_MS);

      // Pump runs in background; first-byte arrival is the gate that lets us
      // proceed (start the drift loop, etc.). All errors during pump are
      // logged but don't propagate after first-byte (already past fallback gate).
      (async () => {
        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) {
              reportPcmStatus('mse-reader-done', 'bytes=' + bytesReceived);
              break;
            }
            if (!value || value.length === 0) continue;
            bytesReceived += value.length;
            if (!firstByteAt) {
              firstByteAt = Date.now();
              clearTimeout(firstByteTimer);
              reportPcmStatus('mse-first-byte', 'len=' + value.length);
              firstByteResolve();
            }
            // Append (or queue if SB busy)
            if (sb.updating || pcmAppendQueue.length > 0) {
              pcmAppendQueue.push(value);
            } else {
              try { sb.appendBuffer(value); }
              catch (e) {
                if (e && e.name === 'QuotaExceededError') {
                  // Buffer full — trim and retry
                  try {
                    if (sb.buffered.length > 0) {
                      const removeEnd = Math.max(sb.buffered.start(0) + 0.1, audioEl.currentTime - 0.5);
                      if (removeEnd > sb.buffered.start(0)) {
                        sb.remove(sb.buffered.start(0), removeEnd);
                        pcmAppendQueue.unshift(value);
                      }
                    }
                  } catch (_) {}
                } else {
                  reportPcmStatus('mse-append-err', e && e.message);
                }
              }
            }
          }
        } catch (e) {
          reportPcmStatus('mse-pump-err', e && e.message);
        }
      })();

      // Block here until first byte arrives (or watchdog throws)
      await firstByteSignal;

      // Now start playback. Native <audio> may auto-play once it sees data via
      // the MediaSource — call play() explicitly anyway for the platforms
      // that need it.
      try {
        await audioEl.play();
        reportPcmStatus('mse-play-resolved', 'ct=' + audioEl.currentTime.toFixed(2));
      } catch (e) {
        reportPcmStatus('mse-play-rejected', (e && e.name) + ': ' + (e && e.message));
      }

      // Drift loop — trim old data, seek to live edge if we fall behind.
      let lastDriftReport = 0;
      let probeSent = false;

      if (pcmDriftTimer) { try { clearInterval(pcmDriftTimer); } catch (_) {} }
      pcmDriftTimer = setInterval(() => {
        if (currentMode !== 'http-pcm') {
          clearInterval(pcmDriftTimer);
          pcmDriftTimer = null;
          return;
        }
        if (!sb || !ms || ms.readyState !== 'open') return;
        if (audioEl.readyState < 2) return;
        if (sb.buffered.length === 0) return;

        const liveEdge = sb.buffered.end(sb.buffered.length - 1);
        const cur = audioEl.currentTime;
        const lag = liveEdge - cur;
        const now = Date.now();

        // Trim old data. Only call remove() when SB is idle and there's
        // actually room to free (avoid pointless updateend churn).
        if (!sb.updating && cur > TRIM_KEEP_BEHIND) {
          const trimEnd = cur - TRIM_KEEP_BEHIND;
          if (sb.buffered.start(0) + 0.05 < trimEnd) {
            try { sb.remove(sb.buffered.start(0), trimEnd); } catch (_) {}
          }
        }

        // One-shot probe — does seek actually move the playhead inside the
        // MSE buffer? If yes we're past the historical floor; if no we'll
        // need RTP later.
        if (!probeSent && lag > 0.5) {
          probeSent = true;
          const before = cur;
          const target = liveEdge - TARGET_LATENCY;
          let method = 'currentTime';
          try {
            if (typeof audioEl.fastSeek === 'function') {
              audioEl.fastSeek(target);
              method = 'fastSeek';
            } else {
              audioEl.currentTime = target;
            }
          } catch (e) {}
          setTimeout(() => {
            const after = audioEl.currentTime;
            const works = Math.abs(after - target) < 0.15;
            reportPcmStatus('mse-seek-probe', JSON.stringify({
              method,
              seekable_length: audioEl.seekable.length,
              seekable_start: audioEl.seekable.length > 0 ? audioEl.seekable.start(0) : null,
              seekable_end: audioEl.seekable.length > 0 ? audioEl.seekable.end(audioEl.seekable.length - 1) : null,
              buffered_start: sb.buffered.length > 0 ? sb.buffered.start(0) : null,
              buffered_end: liveEdge,
              ct_before: before,
              ct_after: after,
              target,
              seek_works: works
            }));
          }, 120);
        }

        if (lag > HARD_LAG) {
          const target = liveEdge - TARGET_LATENCY;
          try {
            if (typeof audioEl.fastSeek === 'function') audioEl.fastSeek(target);
            else audioEl.currentTime = target;
          } catch (_) {}
          if (now - lastDriftReport > 1000) {
            reportPcmStatus('mse-drift-resync', 'lag=' + lag.toFixed(2) + 's seek→' + target.toFixed(2));
            lastDriftReport = now;
          }
          audioEl.playbackRate = 1.0;
        } else if (lag > SOFT_LAG) {
          if (audioEl.playbackRate !== 1.05) {
            audioEl.playbackRate = 1.05;
            if (now - lastDriftReport > 1500) {
              reportPcmStatus('mse-drift-catchup', 'lag=' + lag.toFixed(2) + 's 1.05x');
              lastDriftReport = now;
            }
          }
        } else if (lag < TARGET_LATENCY * 1.4 && audioEl.playbackRate !== 1.0) {
          audioEl.playbackRate = 1.0;
        }
      }, 250);

      reportPcmStatus('mse-active', 'TARGET_LATENCY=' + TARGET_LATENCY);
    }

    async function connectHttpPcm(httpUrl) {
      log('Connecting WebM/Opus stream...');
      reportPcmStatus('handler-entered', 'url=' + httpUrl);
      disconnect();
      currentMode = 'http-pcm';
      reportPcmStatus('mode-active', 'http-pcm-after-disconnect');

      // Capability probe
      const caps = {
        AudioContext: typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined',
        MediaSource: typeof MediaSource !== 'undefined' || typeof WebKitMediaSource !== 'undefined',
        HTMLAudioElement: typeof HTMLAudioElement !== 'undefined',
        fetch: typeof fetch !== 'undefined',
        ReadableStream: typeof ReadableStream !== 'undefined',
        AbortController: typeof AbortController !== 'undefined',
        WebSocket: typeof WebSocket !== 'undefined'
      };
      try {
        const audioProbe = document.createElement('audio');
        caps.audio_canPlay_webm_opus = audioProbe.canPlayType('audio/webm; codecs="opus"');
        caps.audio_canPlay_mp3 = audioProbe.canPlayType('audio/mpeg');
        caps.audio_canPlay_aac = audioProbe.canPlayType('audio/mp4; codecs="mp4a.40.2"');
        try {
          caps.mse_isTypeSupported_webm_opus = (typeof MediaSource !== 'undefined') &&
            MediaSource.isTypeSupported('audio/webm; codecs="opus"');
        } catch (e) { caps.mse_typeProbeErr = e && e.message; }
      } catch (e) { caps.canPlayTypeErr = e && e.message; }
      reportPcmStatus('capabilities', JSON.stringify(caps));

      // 1.5.8 EMERGENCY: MSE attempt disabled.
      // 1.5.6/1.5.7 testing showed `await fetch()` hangs forever on this
      // runtime even with watchdogs (the watchdog itself either doesn't
      // run or the cached old receiver is being served). Symptoms in user
      // logs: receiver stops at `mse-fetch-start` and never reports
      // `mse-fallback-to-audio`. Audio is dead.
      // Going straight to the plain <audio src=> path (which has worked
      // since 1.5.0) until the research path ships a working alternative
      // (likely XHR-based feeding into MSE, per Cast Audio compatibility
      // patterns; or the owntone-style 85CDB22F + Cast RTP rewrite).
      reportPcmStatus('mse-skip', 'mse-disabled-1.5.8');

      // Plain <audio src> fallback. The native audio element opens its own
      // HTTP connection, decodes the chunked WebM/Opus stream and starts
      // playing as soon as `canplay` fires. Most-tested path on Cast Audio.
      const audioEl = webrtcAudio;
      try { hlsAudio.pause(); hlsAudio.removeAttribute('src'); hlsAudio.load(); } catch (e) {}

      audioEl.preload = 'auto';
      audioEl.crossOrigin = 'anonymous';
      audioEl.playbackRate = 1.0;
      if ('preservesPitch' in audioEl) audioEl.preservesPitch = true;
      if ('mozPreservesPitch' in audioEl) audioEl.mozPreservesPitch = true;
      if ('webkitPreservesPitch' in audioEl) audioEl.webkitPreservesPitch = true;

      // Wire up the native media events as status reports back to the PC
      const events = ['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','playing','waiting','stalled','suspend','ended','error','emptied'];
      events.forEach(ev => {
        audioEl.addEventListener(ev, function listener() {
          let detail;
          if (ev === 'error') {
            const me = audioEl.error;
            detail = me ? `code=${me.code} msg=${me.message}` : 'unknown';
          } else {
            detail = describeAudioElement(audioEl);
          }
          reportPcmStatus('audio-' + ev, detail);
          if (ev === 'playing') reportPcmStatus('playing', detail);
        }, { once: false });
      });

      audioEl.src = httpUrl;
      reportPcmStatus('audio-src-set', httpUrl);

      try {
        audioEl.load();  // explicitly start the load
      } catch (e) { reportPcmStatus('audio-load-failed', e && e.message); }

      try {
        await audioEl.play();
        reportPcmStatus('play-resolved', describeAudioElement(audioEl));
      } catch (e) {
        reportPcmStatus('play-rejected', (e && e.name) + ': ' + (e && e.message));
      }

      let healthTicks = 0;
      if (pcmHealthTimer) { try { clearInterval(pcmHealthTimer); } catch (e) {} }
      pcmHealthTimer = setInterval(() => {
        if (currentMode !== 'http-pcm') {
          clearInterval(pcmHealthTimer);
          pcmHealthTimer = null;
          return;
        }
        healthTicks += 1;
        reportPcmStatus('audio-health', describeAudioElement(audioEl));
        if (healthTicks >= 12) {
          clearInterval(pcmHealthTimer);
          pcmHealthTimer = null;
        }
      }, 1000);

      // ─── Active live-edge drift management ────────────────────────────
      // The native <audio> element on Cast Audio may not snap to live edge
      // once playing. Keep this quality-first: probe whether seek actually
      // works, then use hard seek only when proven. Do not use playbackRate
      // catch-up on the plain <audio> path; it can create audible artifacts.
      const TARGET_LAG = 0.30;
      const PROBE_LAG = 0.80;
      const HARD_LAG = 1.50;
      const NORMAL_RATE = 1.0;
      let lastDriftReport = 0;
      let seekProbeSent = false;
      let seekActuallyWorks = null;  // true/false once probed; null until first attempt
      let lastNoBufferReport = 0;

      if (pcmDriftTimer) { try { clearInterval(pcmDriftTimer); } catch (e) {} }
      pcmDriftTimer = setInterval(() => {
        if (currentMode !== 'http-pcm') {
          clearInterval(pcmDriftTimer);
          pcmDriftTimer = null;
          return;
        }
        if (audioEl.paused || audioEl.readyState < 2) return;
        if (audioEl.buffered.length === 0) {
          const now = Date.now();
          if (now - lastNoBufferReport > 2000) {
            reportPcmStatus('drift-no-buffered-range', describeAudioElement(audioEl));
            lastNoBufferReport = now;
          }
          return;
        }
        const liveEdge = audioEl.buffered.end(audioEl.buffered.length - 1);
        const cur = audioEl.currentTime;
        const lag = liveEdge - cur;
        const now = Date.now();

        // 1.5.4: one-shot probe — does this audio element actually let us seek?
        // Per MDN, Chromium can treat live HTTP streams as non-seekable. If
        // true, currentTime/fastSeek is ignored and latency is the audio
        // element's internal buffer until a real MSE/RTP path replaces it.
        if (!seekProbeSent && lag > PROBE_LAG) {
          seekProbeSent = true;
          const seekableInfo = {
            seekable_length: audioEl.seekable.length,
            seekable_start: audioEl.seekable.length > 0 ? audioEl.seekable.start(0) : null,
            seekable_end: audioEl.seekable.length > 0 ? audioEl.seekable.end(audioEl.seekable.length - 1) : null,
            buffered_end: liveEdge,
            currentTime_before: cur
          };
          const probeTarget = liveEdge - TARGET_LAG;
          try {
            if (typeof audioEl.fastSeek === 'function') {
              audioEl.fastSeek(probeTarget);
              seekableInfo.seek_method = 'fastSeek';
            } else {
              audioEl.currentTime = probeTarget;
              seekableInfo.seek_method = 'currentTime';
            }
          } catch (e) {
            seekableInfo.seek_error = e && e.message;
          }
          // Re-read currentTime AFTER attempted seek to see if it actually moved
          setTimeout(() => {
            seekableInfo.currentTime_after = audioEl.currentTime;
            seekableInfo.seek_target = probeTarget;
            seekActuallyWorks = Math.abs(audioEl.currentTime - probeTarget) < 0.1;
            seekableInfo.seek_works = seekActuallyWorks;
            reportPcmStatus('seek-probe', JSON.stringify(seekableInfo));
            if (!seekActuallyWorks) {
              reportPcmStatus('drift-unbounded', 'plain-audio-live-stream-not-seekable; playbackRate disabled for quality');
            }
          }, 100);
        }

        if (lag > HARD_LAG && seekActuallyWorks === true) {
          const target = Math.max(cur, liveEdge - TARGET_LAG);
          try {
            if (typeof audioEl.fastSeek === 'function') audioEl.fastSeek(target);
            else audioEl.currentTime = target;
          } catch (e) {}
          if (now - lastDriftReport > 1000) {
            reportPcmStatus('drift-resync', 'lag=' + lag.toFixed(2) + 's → seek ' + target.toFixed(2));
            lastDriftReport = now;
          }
          if (audioEl.playbackRate !== NORMAL_RATE) audioEl.playbackRate = NORMAL_RATE;
        } else {
          if (audioEl.playbackRate !== NORMAL_RATE) audioEl.playbackRate = NORMAL_RATE;
          if (lag > HARD_LAG && seekActuallyWorks === false && now - lastDriftReport > 5000) {
            reportPcmStatus('drift-unbounded', 'lag=' + lag.toFixed(2) + 's; seek unsupported; playbackRate disabled');
            lastDriftReport = now;
          }
        }
      }, 500);
    }

    // Wrap disconnect again to also tear down http-pcm
    const _disconnectInnerWs = disconnect;
    disconnect = function() {
      disconnectHttpPcm();
      _disconnectInnerWs();
    };

    // Wrap the existing disconnect to also tear down WebSocket
    const _disconnectWebRtcOrHls = disconnect;
    disconnect = function() {
      disconnectWebSocket();
      _disconnectWebRtcOrHls();
    };

    // Handle custom messages
    function handleMessage(event) {
      console.log('[Cast] Message:', event.data);
      const data = event.data;

      switch (data.type) {
        case 'connect':
          if (data.url) connectWebRTC(data.url, data.stream || 'pcaudio');
          break;
        case 'request_offer':
        case 'request-offer':
          requestProxyOffer(data.stream || 'pcaudio');
          break;
        case 'answer':
          if (data.sdp) applyProxyAnswer(data.sdp);
          break;
        case 'hls':
          if (data.url) connectHLS(data.url);
          break;
        case 'ws':
          // Low-latency WebSocket + Web Audio API mode (likely blocked by Cast
          // mixed-content rules; left in place for testing)
          if (data.url) {
            connectWebSocket(data.url, data.sampleRate || 48000, data.channels || 2);
          }
          break;
        case 'http-pcm':
          // Low-latency HTTP PCM stream (works because HTTP fetch to private IPs
          // is allowed from the HTTPS receiver page on Cast Audio runtime)
          if (data.url) {
            connectHttpPcm(data.url);
          }
          break;
        case 'disconnect':
        case 'close':
          disconnect();
          log('Disconnected');
          break;
        case 'measure-latency':
          // PC requested latency measurement
          startRTTMeasurement();
          break;
      }
    }

    context.addCustomMessageListener(WEBRTC_NAMESPACE, handleMessage);

    // Intercept LOAD requests
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        console.log('[Cast] LOAD request:', JSON.stringify(request, null, 2));

        if (request.media && request.media.contentId) {
          const contentId = request.media.contentId;

          // Handle webrtc:// prefix
          if (contentId.startsWith('webrtc://')) {
            const httpsUrl = contentId.replace('webrtc://', '');
            const streamName = (request.media.customData && request.media.customData.stream) || 'pcaudio';
            console.log('[Cast] WebRTC URL:', httpsUrl);
            connectWebRTC(httpsUrl, streamName);
            return null;
          }

          // Handle HLS URLs (.m3u8)
          if (contentId.includes('.m3u8')) {
            console.log('[Cast] HLS URL:', contentId);
            connectHLS(contentId);
            return null;
          }
        }

        // Check customData for WebRTC
        if (request.media && request.media.customData && request.media.customData.webrtcUrl) {
          connectWebRTC(request.media.customData.webrtcUrl, request.media.customData.stream || 'pcaudio');
          return null;
        }

        if (request.customData && request.customData.webrtcUrl) {
          connectWebRTC(request.customData.webrtcUrl, request.customData.stream || 'pcaudio');
          return null;
        }

        // Default: let Cast framework handle it
        if (request.media) {
          request.media.streamType = cast.framework.messages.StreamType.LIVE;
          request.autoplay = true;
        }
        return request;
      }
    );

    context.start({
      playbackConfig: playbackConfig,
      skipPlayersLoad: false,
      disableIdleTimeout: true,
      supportedCommands: cast.framework.messages.Command.ALL_BASIC_MEDIA,
      customNamespaces: {
        [WEBRTC_NAMESPACE]: cast.framework.system.MessageType.JSON
      }
    });

    log('Waiting for connection...');
  </script>
</body>
</html>
